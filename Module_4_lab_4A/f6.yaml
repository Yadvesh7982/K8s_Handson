apiVersion: v1
kind: Pod
metadata: {name: smf-buggy, namespace: cnf-lab, labels: {cnf: smf}}
spec:
  containers:
    - name: smf
      image: busybox:1.36
      command: ["/bin/sh","-c"]
      args:
        - >
          echo "$(date -Iseconds) INFO  SMF starting, release 2.4.1";
          echo "$(date -Iseconds) INFO  loading /etc/smf/licence.dat";
          sleep 5;
          echo "$(date -Iseconds) FATAL licence file not found - exiting" >&2;
          exit 1
