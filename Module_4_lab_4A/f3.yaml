apiVersion: v1
kind: Pod
metadata: {name: udm, namespace: cnf-lab, labels: {cnf: udm}}
spec:
  containers:
    - name: udm
      image: polinux/stress
      command: ["stress"]
      args: ["--vm", "1", "--vm-bytes", "200M", "--vm-hang", "1"]
      resources:
        requests: {memory: "300Mi", cpu: "100m"}
        limits:   {memory: "300Mi", cpu: "200m"}
