apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-n4-from-smf
  namespace: upf
spec:
  podSelector:
    matchLabels:
      cnf: upf
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              cnf-namespace: smf
      ports:
        - protocol: TCP
          port: 80
  egress:
    # DNS must be allowed explicitly or the UPF cannot resolve anything
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
