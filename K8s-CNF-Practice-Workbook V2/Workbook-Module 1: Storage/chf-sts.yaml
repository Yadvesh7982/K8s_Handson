apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chf
  namespace: chf
spec:
  serviceName: chf-headless
  replicas: 2
  selector:
    matchLabels:
      cnf: chf
  template:
    metadata:
      labels:
        cnf: chf
    spec:
      containers:
        - name: chf
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - 'while true; do echo "$(date -Iseconds) charging-record" >> /var/lib/chf/cdr.log; sleep 5; done'
          volumeMounts:
            - name: cdr-store
              mountPath: /var/lib/chf
  volumeClaimTemplates:
    - metadata:
        name: cdr-store
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: cnf-local-fast
        resources:
          requests:
            storage: 1Gi
