apiVersion: v1
kind: Namespace
metadata:
  name: smf-w
  labels:
    cnf-namespace: smf-w
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chf
  namespace: chf-w
spec:
  replicas: 2
  selector:
    matchLabels:
      cnf: chf
  template:
    metadata:
      labels:
        cnf: chf
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker1
      containers:
        - name: chf
          image: nginx:1.27-alpine
          ports:
            - name: oam
              containerPort: 80
            - name: diameter
              containerPort: 3868
---
apiVersion: v1
kind: Service
metadata:
  name: chf-oam-ext
  namespace: chf-w
spec:
  type: NodePort
  selector:
    cnf: chf
  ports:
    - name: oam
      port: 8080
      targetPort: oam
---
apiVersion: v1
kind: Service
metadata:
  name: chf-diameter
  namespace: chf-w
spec:
  type: ClusterIP
  selector:
    cnf: chf
  ports:
    - name: diameter
      port: 3868
      targetPort: diameter
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chf-diameter-restricted
  namespace: chf-w
spec:
  podSelector:
    matchLabels:
      cnf: chf
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              cnf-namespace: smf-w
      ports:
        - protocol: TCP
          port: 3868
    - ports:
        - protocol: TCP
          port: 80
