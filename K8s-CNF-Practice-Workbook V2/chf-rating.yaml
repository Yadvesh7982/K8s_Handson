apiVersion: apps/v1
kind: Deployment
metadata:
  name: chf-rating
  namespace: chf
spec:
  replicas: 1
  selector:
    matchLabels:
      cnf: chf-rating
  template:
    metadata:
      labels:
        cnf: chf-rating
    spec:
      containers:
        - name: chf
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - 'mkdir -p /var/log/chf; while true; do echo "$(date -Iseconds) INFO wrote charging-record" >> /var/log/chf/cdr.log; sleep 5; done'
          volumeMounts:
            - name: cdr
              mountPath: /var/lib/chf
      volumes:
        - name: cdr
          persistentVolumeClaim:
            claimName: chf-cdr
