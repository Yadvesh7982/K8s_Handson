apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chf-lun-pvc
  namespace: chf
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual-lun
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chf-billing
  namespace: chf
spec:
  replicas: 1
  selector:
    matchLabels:
      cnf: chf-billing
  template:
    metadata:
      labels:
        cnf: chf-billing
    spec:
      containers:
        - name: chf
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - 'while true; do echo "$(date -Iseconds) rating-group=9 volume=4096" >> /var/lib/chf/cdr.log; sleep 5; done'
          volumeMounts:
            - name: lun
              mountPath: /var/lib/chf
      volumes:
        - name: lun
          persistentVolumeClaim:
            claimName: chf-lun-pvc
